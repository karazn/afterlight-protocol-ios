[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-usb-mirror"
version = "0.1.0"
description = "Low-latency iPhone screen mirroring to Windows over USB"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.7,<7",
  "av>=13,<17",
  "numpy>=2,<3",
]

[project.scripts]
iphone-usb-mirror = "iphone_mirror.app:main"

[tool.setuptools]
package-dir = {"" = "windows"}

[tool.setuptools.packages.find]
where = ["windows"]

